      interval: 300
    proxy: 直连

  优选:
    url: "https://1.1990921.xyz/sub?token=0aa161954c4098f94548738de8f46f81"
    type: http
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

  良心云:
    url: "https://liangxin.xyz/api/v1/liangxin?OwO=fbd7e5cba09a8858f1d136aa915b36e3"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
