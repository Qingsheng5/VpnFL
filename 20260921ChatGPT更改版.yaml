proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

external-controller: 127.0.0.1:9090
# external-ui: ui
# external-ui-name: zashboard
# external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "123456"

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://1.1.1.1/dns-query
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn

    # NAS / DDNS：避免 Fake-IP 影响访问
    - 1.19960921.xyz
    - 1.wuqingsheng.com
    - 1.wuqingsheng.cn
    - +.19960921.xyz
    - +.wuqingsheng.com
    - +.wuqingsheng.cn

    - '*.stun.*.*'

tun:
  enable: true
  stack: system
  device: utun
  endpoint-independent-nat: true
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  auto-redirect: false

profile:
  store-selected: true
  store-fake-ip: true

# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 直连
    - 所有-手动
    - 所有-自动
    - 美国-故转
    - 自建-自动
    - 香港-故转
    - 台湾-故转
    - 日本-故转
    - 新加坡-故转
    - 韩国-故转
    - 英国-故转
    - 其他-故转
    - 拒绝

proxy-groups:

  # ========================
  # 业务分流组
  # ========================

  - {name: 🤖 AI, <<: *default}
  - {name: 🐙 GitHub, <<: *default}
  - {name: ✈️ Telegram, <<: *default}
  - {name: 💬 WhatsApp, <<: *default}
  - {name: 📘 Facebook, <<: *default}
  - {name: 📺 BiliBili, <<: *default}
  - {name: ▶️ YouTube, <<: *default}
  - {name: 🎵 TikTok, <<: *default}
  - {name: 🐦Twitter(X), <<: *default}
  - {name: 🎬 Media, <<: *default}
  - {name: 🎮 Steam, <<: *default}
  - {name: 🕹️ Games, <<: *default}
  - {name: 💰 Crypto, <<: *default}
  - {name: 🍎 Apple, <<: *default}
  - {name: 🔍 Google, <<: *default}
  - {name: 🪟 Microsoft, <<: *default}
  - {name: 🧪 Test, <<: *default}
  - {name: ⛔ Block, <<: *default}
  - {name: 🌍 国外, <<: *default}
  - {name: 🏠 国内, <<: *default}
  - {name: 📦 其他, <<: *default}

  # ========================
  # 全部节点
  # ========================

  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝)).)*$"

  - name: 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "^((?!(直连|拒绝|官网|重置|到期|GB|机场|Expire|Reset)).)*$"


  # ========================
  # 美国
  # ========================

  - name: 美国-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 自建-自动
      - 美国-手动
      - 美国-自动

  - name: 自建-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(WQS)).*$"

  - name: 美国-手动
    type: select
    include-all: true
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"

  - name: 美国-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"

