# 通用手动/自动组
🚀 手动选择 = select,policy-regex-filter=^(?!(直连|DIRECT|拒绝|REJECT|官网|重置|到期|机场|流量|剩余|套餐|过期|Expire|Reset|Traffic|GB)).*$
♻️ 自动选择 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=^(?!(直连|DIRECT|拒绝|REJECT|官网|重置|到期|机场|流量|剩余|套餐|过期|Expire|Reset|Traffic|GB)).*$

